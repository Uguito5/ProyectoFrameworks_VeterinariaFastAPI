<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: A5; margin: 10mm; }
        body { font-family: 'Arial', sans-serif; line-height: 1.5; }
        .receta-header { text-align: center; border-bottom: 2px solid #198754; padding-bottom: 10px; }
        .receta-body { margin-top: 30px; }
        .footer { margin-top: 50px; text-align: center; font-size: 10pt; }
    </style>
</head>
<body>
    <div class="receta-header">
        <h1>Receta Médica</h1>
        <p>{{ current_time }}</p>
    </div>

    <div class="receta-body">
        <p><strong>Paciente:</strong> {{ mascota.nombre }}</p>
        <p><strong>Propietario:</strong> {{ mascota.dueno.nombre }}</p>
        <hr>
        {% for receta in recetas %}
            <h3>{{ receta.medicamento }}</h3>
            <p><strong>Indicaciones:</strong> {{ receta.indicaciones }}</p>
            <br>
        {% endfor %}
    </div>

    <div class="footer">
        <p>Firma del Veterinario: __________________________</p>
    </div>
</body>
</html>
